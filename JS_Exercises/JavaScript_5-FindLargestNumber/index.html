<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Largest Number</title>
    <link rel="stylesheet" href="./Assets/CSS/bootstrap.min.css">
    <script src="./Assets/JS/script.js"></script>
</head>
<body>
    <form onsubmit="maxNum(event)">
        <div class="container">
            <div class="p-3 mt-5 bg-light text-dark">
                <div>
                    <h2 class="text-center">Find Largest Number</h2>
                    <input type="text" id="number" placeholder="Enter Two Numbers To Validate" class="w-100">
                    <div class="d-flex gap-5 justify-content-center p-3">
                        <button type="submit" class="btn btn-warning btn-lg">Submit</button>
                         <button type="reset" onclick="clearForm()" class="btn btn-warning btn-lg">Reset</button>
                    </div>
                    <p id="message" class="fw-bold  text-center"></p>
                </div>
            </div>
        </div>
    </form>

</body>
</html>
