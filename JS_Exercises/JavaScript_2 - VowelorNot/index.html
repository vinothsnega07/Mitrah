<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Assets/CSS/bootstrap.min.css">
    <script src="./Assets/JS/script.js"></script>
    <title>Check Vowel Or Not</title>
</head>

<body>
    <form  onsubmit="vowelCheck(event)" >
        <div class="container">
            <div class="p-3 mt-5  text-bg-light">
                <div>
                    <h2 class="text-center">Vowel Or Not</h2>
                    <input type="text" id="sentence" placeholder="Type Sentence....." class="w-100">
                    <div class="d-flex gap-5 justify-content-center p-3">
                        <button type="submit"  class="btn btn-secondary btn-lg">Submit</button>
                        <button type="reset" onclick="reSet()" class="btn btn-secondary btn-lg">Reset</button>
                    </div>

                    <p id="message" class="fw-bold  text-center"></p>

                </div>
            </div>
        </div>
    </form>
</body>

</html>
