<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace Array Position</title>
    <link rel="stylesheet" href="./Assets/CSS/bootstrap.min.css">
    <script src="./Assets/JS/script.js"></script>
</head>

<body>
    <form action="" onsubmit="replaceArray(event)" >
        <div class="container">
            <div class="p-3 mt-5 bg-danger-subtle text-danger-emphasis">
                <div>
                    <h2 class="text-center">Replace Array Position</h2>
                    <input type="text" id="sentence" placeholder="Enter Values Like a,b,c......." class="w-100 p-2">
                     <input type="text" id="position" placeholder="Enter the Position....." class="w-100 mt-4 p-2">
                      <input type="text" id="newElement" placeholder="New Value....." class="w-100 mt-4 p-2">
                    <div class="d-flex gap-5 justify-content-center p-3">
                        <button type="submit" class="btn btn-primary btn-lg">Submit</button>
                        <button type="reset" onclick="clearForm()"  class="btn btn-primary btn-lg">Reset</button>
                    </div>

                    <p id="message" class="fw-bold  text-center"></p>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
